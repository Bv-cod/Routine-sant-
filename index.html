<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>Routine+ Santé</title>
<style>
:root{
  --bg:#07111f;
  --panel:#101928;
  --panel2:#121d2e;
  --text:#f7f9fc;
  --muted:#9aa8b9;
  --line:#233046;
  --purple:#8757ff;
  --blue:#3f9cff;
  --green:#20df89;
  --orange:#ff7a31;
  --pink:#ff4fa3;
  --cyan:#28d3c4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at top right,rgba(87,70,255,.12),transparent 28%),
    linear-gradient(180deg,#07111f,#09121f 45%,#08111d);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  min-height:100vh;
  padding-bottom:100px;
}
header{padding:calc(20px + env(safe-area-inset-top)) 18px 8px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand h1{font-size:31px;line-height:1;margin:0 0 7px;font-weight:850;letter-spacing:-.7px}
.brand .date{color:#c4ccda;font-size:15px}
.header-actions{display:flex;gap:10px}
.icon-btn{
  width:48px;height:48px;border-radius:50%;
  border:1px solid #1d2a3c;background:#121b2b;color:#fff;font-size:22px;
  display:grid;place-items:center;
}
main{padding:0 14px}
.card{
  background:linear-gradient(180deg,rgba(16,25,40,.96),rgba(12,20,33,.96));
  border:1px solid #1e2c40;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}
.week-card{padding:10px;margin:14px 0 16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{text-align:center;padding:11px 2px;border-radius:18px;color:#aab5c5}
.wday .name{font-size:12px;margin-bottom:4px}
.wday .num{font-size:20px;font-weight:700}
.wday .mini{margin:8px auto 0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#5c54ff;color:white}
.wday.active{background:linear-gradient(180deg,#864cff,#4d78ff);color:white;box-shadow:0 8px 22px rgba(95,81,255,.28)}
.progress-card{
  padding:22px 22px 20px;
  background:
    radial-gradient(circle at 75% 30%,rgba(153,86,255,.18),transparent 24%),
    linear-gradient(135deg,#251b53,#202454 60%,#181b40);
  border:1px solid #3a3276;
  display:flex;align-items:center;justify-content:space-between;gap:14px
}
.progress-label{color:#d0d3df;font-size:15px}
.progress-value{font-size:58px;font-weight:850;line-height:1;margin:16px 0 8px}
.progress-sub{color:#b5bfd0}
.progress-sub b{color:#8a57ff}
.ring{
  width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--purple) 0 83%,#2d2c59 83% 100%);
  display:grid;place-items:center;position:relative;flex:0 0 auto
}
.ring:after{
  content:"";width:105px;height:105px;border-radius:50%;
  background:#1b2144;position:absolute
}
.ring span{position:relative;z-index:1;font-size:40px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.metric{padding:16px 14px 13px;min-height:145px}
.metric .ico{font-size:28px}
.metric .label{color:#b2bcc9;font-size:13px;margin-top:9px}
.metric .value{font-size:27px;font-weight:800;margin-top:4px}
.metric .value small{font-size:13px;font-weight:600;color:#d0d5df}
.bar{height:6px;background:#202c3c;border-radius:99px;margin-top:16px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.section-head h2{margin:0;font-size:22px}
.seeall{border:0;background:#111a29;color:#d2d8e3;padding:9px 12px;border-radius:999px;font-size:13px}
.habit{padding:0 14px;margin:10px 0}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 0}
.hicon{
  width:54px;height:54px;border-radius:15px;display:grid;place-items:center;
  font-size:27px;flex:0 0 auto
}
.htext{flex:1;min-width:0}
.hname{font-size:17px;font-weight:800}
.hsub{font-size:13px;color:#a7b2c2;margin-top:3px}
.hcount{font-size:19px;font-weight:800;margin-right:4px}
.plus,.check{
  width:46px;height:46px;border-radius:50%;background:transparent;font-size:29px;
  display:grid;place-items:center;font-weight:500
}
.plus{border:2px solid currentColor}
.check{border:0;background:var(--green);color:white;font-size:23px}
.hprogress{height:5px;background:#1b2738;border-radius:99px;overflow:hidden}
.hprogress span{display:block;height:100%;border-radius:99px}
.fab{
  position:fixed;right:18px;bottom:92px;width:62px;height:62px;border-radius:50%;
  border:0;color:white;font-size:34px;font-weight:300;
  background:linear-gradient(135deg,#9c50ff,#4b7bff 60%,#ff4da6);
  box-shadow:0 14px 30px rgba(94,73,255,.35);z-index:8
}
nav{
  position:fixed;left:0;right:0;bottom:0;
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  background:rgba(7,14,25,.96);border-top:1px solid #223047;
  display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(16px);z-index:7
}
nav button{border:0;background:transparent;color:#9aa7b8;font-size:10.5px;padding:5px 2px}
nav button.active{color:#8a57ff}
.navico{display:block;font-size:22px;margin-bottom:4px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;z-index:20
}
.modal.show{display:flex}
.sheet{
  width:100%;background:#101827;border-radius:26px 26px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid #26364d
}
.sheet h3{margin:0 0 16px;font-size:22px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:#aab5c5;margin-bottom:6px}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid #26354a;background:#0b1421;color:white;font-size:16px
}
.primary{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#8653ff,#4e80ff);color:white;font-weight:800;font-size:16px;margin-top:8px}
@media(max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metric{min-height:118px}
  .ring{width:125px;height:125px}.ring:after{width:87px;height:87px}.progress-value{font-size:48px}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <h1>Routine+ Santé</h1>
      <div class="date" id="todayDate"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn">⌕</button>
      <button class="icon-btn">🔔</button>
    </div>
  </div>
</header>

<main>
  <div class="card week-card"><div class="week" id="week"></div></div>

  <div class="card progress-card">
    <div>
      <div class="progress-label">Progression du jour</div>
      <div class="progress-value" id="progressPct">0%</div>
      <div class="progress-sub"><b id="doneCount">0</b> / <span id="totalCount">0</span> habitudes terminées</div>
    </div>
    <div class="ring" id="ring"><span>🏆</span></div>
  </div>

  <div class="metrics">
    <div class="card metric"><div class="ico">🔥</div><div class="label">Énergie</div><div class="value"><span id="energyVal">8</span><small>/10</small></div><div class="bar"><span id="energyBar" style="width:80%;background:var(--orange)"></span></div></div>
    <div class="card metric"><div class="ico">🙂</div><div class="label">Humeur</div><div class="value"><span id="moodVal">8</span><small>/10</small></div><div class="bar"><span id="moodBar" style="width:80%;background:#ffd117"></span></div></div>
    <div class="card metric"><div class="ico">💧</div><div class="label">Eau</div><div class="value"><span id="waterVal">6</span><small>/8 verres</small></div><div class="bar"><span id="waterBar" style="width:75%;background:var(--blue)"></span></div></div>
    <div class="card metric"><div class="ico">🌙</div><div class="label">Sommeil</div><div class="value"><span id="sleepVal">7h20</span></div><div class="bar"><span style="width:78%;background:var(--purple)"></span></div></div>
  </div>

  <div class="section-head"><h2>Mes habitudes</h2><button class="seeall">Tout voir ›</button></div>
  <div id="habits"></div>
</main>

<button class="fab" id="fab">＋</button>

<nav>
  <button class="active"><span class="navico">⌂</span>Aujourd’hui</button>
  <button><span class="navico">☑</span>Habitudes</button>
  <button><span class="navico">◎</span>Objectifs</button>
  <button><span class="navico">▥</span>Statistiques</button>
  <button><span class="navico">♙</span>Profil</button>
</nav>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>Ajouter une habitude</h3>
    <div class="field"><label>Nom</label><input id="habitName" placeholder="Ex. Lire"></div>
    <div class="field"><label>Icône</label><select id="habitIcon"><option>🏃</option><option>💧</option><option>🥗</option><option>🏋️</option><option>📖</option><option>🧘</option><option>🚿</option><option>💊</option></select></div>
    <div class="field"><label>Objectif</label><input id="habitTarget" type="number" min="1" value="1"></div>
    <button class="primary" id="addHabit">Ajouter</button>
  </div>
</div>

<script>
const KEY="routineModernV1";
const defaults=[
  {id:1,icon:"🏃",name:"Courir",sub:"Chaque jour",count:1,target:1,color:"#21df88"},
  {id:2,icon:"💧",name:"Boire de l’eau",sub:"8 verres par jour",count:6,target:8,color:"#3f9cff"},
  {id:3,icon:"🥗",name:"Manger sainement",sub:"Chaque jour",count:2,target:3,color:"#ff7a31"},
  {id:4,icon:"🏋️",name:"Séance de musculation",sub:"4 fois par semaine",count:3,target:4,color:"#a356ff"},
  {id:5,icon:"📖",name:"Lire",sub:"20 minutes",count:0,target:1,color:"#ff4fa3"},
  {id:6,icon:"🧘",name:"Méditer",sub:"10 minutes",count:1,target:1,color:"#28d3c4"}
];
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{habits:defaults};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function renderWeek(){
  const box=document.getElementById("week"); box.innerHTML="";
  const now=new Date();
  for(let i=-4;i<=2;i++){
    const d=new Date(now);d.setDate(now.getDate()+i);
    const active=i===0;
    box.innerHTML+=`<div class="wday ${active?"active":""}">
      <div class="name">${d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}</div>
      <div class="num">${d.getDate()}</div>
      ${i<0?'<div class="mini">✓</div>':active?'<div class="mini" style="background:white;color:#6d61ff">•</div>':""}
    </div>`;
  }
}
function renderHabits(){
  const box=document.getElementById("habits");box.innerHTML="";
  db.habits.forEach(h=>{
    const done=h.count>=h.target, pct=Math.min(100,(h.count/h.target)*100);
    const e=document.createElement("div");e.className="card habit";
    e.innerHTML=`<div class="hrow">
      <div class="hicon" style="background:${h.color}22;color:${h.color}">${h.icon}</div>
      <div class="htext"><div class="hname">${h.name}</div><div class="hsub">${h.sub}</div></div>
      <div class="hcount" style="color:${h.color}">${h.count} / ${h.target}</div>
      <button class="${done?"check":"plus"}" style="color:${h.color}">${done?"✓":"+"}</button>
    </div>
    <div class="hprogress"><span style="width:${pct}%;background:${h.color}"></span></div>`;
    e.querySelector("button").onclick=()=>{
      if(done) h.count=0; else h.count=Math.min(h.target,h.count+1);
      save();renderAll();
    };
    box.appendChild(e);
  });
}
function renderProgress(){
  const total=db.habits.length;
  const done=db.habits.filter(h=>h.count>=h.target).length;
  const pct=total?Math.round(done/total*100):0;
  progressPct.textContent=pct+"%";
  doneCount.textContent=done;
  totalCount.textContent=total;
  ring.style.background=`conic-gradient(var(--purple) 0 ${pct}%,#2d2c59 ${pct}% 100%)`;
}
function renderAll(){renderHabits();renderProgress()}
todayDate.textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
fab.onclick=()=>modal.classList.add("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")}
addHabit.onclick=()=>{
  const name=habitName.value.trim(); if(!name)return;
  db.habits.push({
    id:Date.now(),icon:habitIcon.value,name,
    sub:"Chaque jour",count:0,target:Math.max(1,Number(habitTarget.value)||1),
    color:["#21df88","#3f9cff","#ff7a31","#a356ff","#ff4fa3","#28d3c4"][db.habits.length%6]
  });
  habitName.value="";habitTarget.value=1;save();modal.classList.remove("show");renderAll()
};
renderWeek();renderAll();
</script>
</body>
</html>
